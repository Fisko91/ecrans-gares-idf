# Met à jour chaque nuit les horaires théoriques (GTFS IDFM) et publie le site sur GitHub Pages.
name: Horaires théoriques IDFM

on:
  schedule:
    - cron: "30 2 * * *"      # tous les jours vers 3h30 (heure de Paris en hiver)
  workflow_dispatch:           # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v5

      - name: Télécharger le GTFS IDFM
        run: |
          # l'adresse du fichier change à chaque mise à jour d'IDFM : on la relit dans le catalogue
          API="https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/offre-horaires-tc-gtfs-idfm"
          curl -sSL --retry 3 -A "Mozilla/5.0 (horaires-bot)" -o liste.json "$API/exports/json" || true
          URL=$(python3 -c "import json;d=json.load(open('liste.json'));print(next(r['url'] for r in d if r.get('url')))" 2>/dev/null || true)
          if [ -z "$URL" ]; then
            curl -sSL --retry 3 -A "Mozilla/5.0 (horaires-bot)" -o liste.csv "$API/exports/csv?delimiter=%3B" || true
            URL=$(python3 -c "import csv;r=list(csv.DictReader(open('liste.csv',encoding='utf-8-sig'),delimiter=';'));print(r[0]['url'])" 2>/dev/null || true)
          fi
          echo "Adresse du GTFS : $URL"
          test -n "$URL"
          CODE=$(curl -sSL --retry 4 --retry-delay 30 -A "Mozilla/5.0 (horaires-bot)" -o gtfs.zip -w "%{http_code}" "$URL")
          echo "Réponse IDFM : $CODE"
          ls -lh gtfs.zip
          test "$CODE" = "200"
          python3 -c "import zipfile;z=zipfile.ZipFile('gtfs.zip');print(len(z.namelist()),'fichiers dans le GTFS')"

      - name: Extraire les trains (21 jours)
        run: python3 extraire-horaires.py gtfs.zip 21 site

      - name: Garder le dépôt actif (évite la mise en pause des tâches planifiées)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -Iminutes > derniere-mise-a-jour.txt
            git config user.name "horaires-bot"
            git config user.email "horaires-bot@users.noreply.github.com"
            git add derniere-mise-a-jour.txt
            git commit -m "Mise à jour mensuelle $(date +%Y-%m)" || true
            git push || true
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
